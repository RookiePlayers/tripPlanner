name: Tagged release

on:
  workflow_call:
    inputs:
      target-env:
        required: true
        type: string
    outputs:
      version:
        description: "Release tag (e.g. v1.2.3)"
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    name: Release on Conventional Commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Required for semantic-release to analyze commits and push tags
          path: ./
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1
        with:
          version: latest
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Semantic Release
        id: semantic
        run: HUSKY=0 pnpm dlx semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract latest tag (version)
        if: success()
        id: version
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "Latest release: $LATEST_TAG"
          echo "$LATEST_TAG" > version.txt
          # Set the version as an output
          echo "version=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ENV_NAME="${{ inputs.target-env }}"
          APP_BASE="travpal-server"
          APP_NAME="$APP_BASE"
          if [[ "$ENV_NAME" != "prod" ]]; then
            APP_NAME="${APP_BASE}-${ENV_NAME}"
          fi
          IMAGE="registry.fly.io/${APP_NAME}:${VERSION}"
          echo "Building image: ${IMAGE}"
          flyctl auth docker
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Extract latest changelog section
        if: success()
        run: |
          awk '/^## /{if (seen) exit; seen=1} seen' CHANGELOG.md > changelog.txt

      - name: Upload Release Version
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-version
          path: version.txt

      - name: Upload Changelog Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: latest-changelog
          path: changelog.txt

      - name: Upload Build Artifacts (optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./dist/
